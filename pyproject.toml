[project]
name = "daml-agent-benchmark"
version = "0.1.0"
description = "Benchmark for agentic Daml code generation: a coding agent regenerates a repository's implementation files from its test suite inside an isolated container, graded by daml build and daml test."
requires-python = ">=3.12"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "IntellectEU" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pyyaml>=6.0",
    "genai-prices>=0.1.8",
    # The run dashboard's server.
    "fastapi>=0.110",
    "pydantic>=2.0",
    "uvicorn>=0.29",
]

[project.urls]
Homepage = "https://github.com/IntellectEU/daml-agent-benchmark"
Repository = "https://github.com/IntellectEU/daml-agent-benchmark"

[project.scripts]
daml-agent-benchmark = "daml_agent_benchmark.runner:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.15",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# E3 (blank lines around definitions) is still behind ruff's preview flag, so the repo
# asks for preview explicitly. The alignment rules that come with it are ignored: the
# config record lines its defaults up on purpose, and that reads better than the rule.
preview = true
select = ["E", "F", "B"]
ignore = ["E501", "E221", "E261", "E271"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `slow` is opt-in: the sandbox scan over every task copies each source repository
# and takes minutes. Run it with `pytest -m slow`.
markers = ["slow: minutes-long; excluded from a default run"]
addopts = "-q -m 'not slow'"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/daml_agent_benchmark"]
