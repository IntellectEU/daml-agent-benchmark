task: daml-finance/src/test/daml/Daml/Finance/Data/Test/DateClock.daml
notes: ""
mutations:
  - id: move-clock-keeps-old-clock
    source: real-bug
    commit: 123a1c8b92e5e7c3713ce6f849d4610239c1640b
    kind: archival
    reason: Moving the clock creates the new clock without archiving the old one, so both dates stay live.
    patch: |
      diff --git a/src/main/daml/Daml/Finance/Data/V4/Time/DateClock.daml b/src/main/daml/Daml/Finance/Data/V4/Time/DateClock.daml
      --- a/src/main/daml/Daml/Finance/Data/V4/Time/DateClock.daml
      +++ b/src/main/daml/Daml/Finance/Data/V4/Time/DateClock.daml
      @@ -58,7 +58,6 @@ moveClock this@DateClock {date; providers; observers} self eventId eventDescript
           Unit currentDate = date
           newDate = addDays currentDate offset
           clock = this with date = Unit newDate
      -  archive self
         clockCid <- toInterfaceContractId <$> create clock
         eventCid <- toInterfaceContractId <$> create DateClockUpdateEvent with
           providers
  - id: rewind-moves-forward
    source: llm
    target_script: testDateClock
    kind: arithmetic
    reason: The rewind offset has the wrong sign, so rewinding advances the date.
    patch: |
      diff --git a/src/main/daml/Daml/Finance/Data/V4/Time/DateClock.daml b/src/main/daml/Daml/Finance/Data/V4/Time/DateClock.daml
      --- a/src/main/daml/Daml/Finance/Data/V4/Time/DateClock.daml
      +++ b/src/main/daml/Daml/Finance/Data/V4/Time/DateClock.daml
      @@ -48,7 +48,7 @@ template DateClock
             advance self Time.Advance{eventId; eventDescription} =
               moveClock this self eventId eventDescription 1
             rewind self Time.Rewind{eventId; eventDescription} =
      -        moveClock this self eventId eventDescription (-1)
      +        moveClock this self eventId eventDescription 1
       
       -- | HIDE
       moveClock : DateClock -> ContractId Time.I -> Id -> Text -> Int ->
  - id: clock-date-not-updated
    source: llm
    target_script: testDateClock
    kind: field
    reason: The new clock is created from the original contract instead of the clock with the moved date.
    patch: |
      diff --git a/src/main/daml/Daml/Finance/Data/V4/Time/DateClock.daml b/src/main/daml/Daml/Finance/Data/V4/Time/DateClock.daml
      --- a/src/main/daml/Daml/Finance/Data/V4/Time/DateClock.daml
      +++ b/src/main/daml/Daml/Finance/Data/V4/Time/DateClock.daml
      @@ -59,7 +59,7 @@ moveClock this@DateClock {date; providers; observers} self eventId eventDescript
           newDate = addDays currentDate offset
           clock = this with date = Unit newDate
         archive self
      -  clockCid <- toInterfaceContractId <$> create clock
      +  clockCid <- toInterfaceContractId <$> create this
         eventCid <- toInterfaceContractId <$> create DateClockUpdateEvent with
           providers
           observers
