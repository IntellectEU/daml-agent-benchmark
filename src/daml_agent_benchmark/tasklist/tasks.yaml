- repo: daml
  test: sdk/docs/source/sdk/tutorials/smart-contracts/daml/daml-intro-compose/daml/Test/Intro/Asset/Trade.daml
  impl:
    - sdk/docs/source/sdk/tutorials/smart-contracts/daml/daml-intro-compose/daml/Intro/Asset/Trade.daml
- repo: daml
  test: sdk/docs/source/sdk/tutorials/smart-contracts/daml/daml-intro-test/asset-tests/daml/Intro/AssetTests.daml
  impl:
    - sdk/docs/source/sdk/tutorials/smart-contracts/daml/daml-intro-test/asset/daml/Intro/Asset.daml
- repo: daml
  test: sdk/docs/source/sdk/tutorials/smart-contracts/daml/daml-intro-test/asset-tests/daml/Intro/Asset/RoleTests.daml
  impl:
    - sdk/docs/source/sdk/tutorials/smart-contracts/daml/daml-intro-test/asset/daml/Intro/Asset/Role.daml
- repo: daml
  test: sdk/docs/source/sdk/tutorials/smart-contracts/daml/daml-intro-test/asset-tests/daml/Intro/Asset/TradeTests.daml
  impl:
    - sdk/docs/source/sdk/tutorials/smart-contracts/daml/daml-intro-test/asset/daml/Intro/Asset/Trade.daml
- repo: daml
  test: sdk/docs/source/sdk/tutorials/smart-contracts/daml/daml-intro-test/multi-trade-tests/daml/Intro/Asset/MultiTradeTests.daml
  impl:
    - sdk/docs/source/sdk/tutorials/smart-contracts/daml/daml-intro-test/multi-trade/daml/Intro/Asset/MultiTrade.daml
- repo: daml
  test: sdk/docs/source/sdk/tutorials/smart-contracts/daml/daml-intro-interfaces/library-tests/daml/Library/Tests.daml
