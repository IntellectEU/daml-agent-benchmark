# account-hierarchy (SDK 1.17.1): the packages depend on the lib-finance library, included in
# the repository as a git submodule pinned to commit 0b21a072; the handler builds its DAR. Two
# test files exist under core-model/test. Lifecycle.daml and Trade.daml have no test of their
# own and stay visible.
- repo: account-hierarchy
  test: core-model/test/src/Synfini/AccountHierarchy/Custody/Test.daml
  impl:
    - core-model/main/src/Synfini/AccountHierarchy/Custody.daml
- repo: account-hierarchy
  test: core-model/test/src/Synfini/AccountHierarchy/Allocation/Test.daml
  impl:
    - core-model/main/src/Synfini/AccountHierarchy/Allocation.daml
    - core-model/main/src/Synfini/AccountHierarchy/Custody.daml
# splice (SDK 3.3.0 snapshot): packages depend on each other through prebuilt DAR files
# (.daml/dist/<name>-current.dar). Before a task, the splice handler builds the packages that a task
# needs from source, except any package that contains a file which the agent must write: its DAR would
# contain the answer. That package is built by the evaluation, from the agent's code. Tasks
# were chosen so that no prebuilt dependency contains a target package's code. Example: the
# amulet implementation is tested from two test packages. The tasks use the tests in
# splice-token-standard-test, whose dependencies contain no prebuilt copy of amulet. The tests
# in splice-amulet-test were not used: that package depends on a prebuilt DAR of
# splice-token-standard-test, which contains compiled amulet code and would hand the agent the
# answer.
- repo: splice
  test: token-standard/splice-token-standard-test/daml/Splice/Tests/TestAmuletTokenTransfer.daml
  impl:
    - daml/splice-amulet/daml/Splice/AmuletTransferInstruction.daml
    - daml/splice-amulet/daml/Splice/Amulet/TwoStepTransfer.daml
- repo: splice
  test: token-standard/splice-token-standard-test/daml/Splice/Tests/TestAmuletTokenDvP.daml
  impl:
    - daml/splice-amulet/daml/Splice/AmuletAllocation.daml
    - daml/splice-amulet/daml/Splice/Amulet/TwoStepTransfer.daml
- repo: splice
  test: daml/splice-wallet-test/daml/Splice/Scripts/Wallet/TestTransferOffers.daml
  impl:
    - daml/splice-wallet/daml/Splice/Wallet/TransferOffer.daml
- repo: splice
  test: daml/splice-wallet-test/daml/Splice/Scripts/Wallet/TestMintingDelegation.daml
  impl:
    - daml/splice-wallet/daml/Splice/Wallet/MintingDelegation.daml
- repo: splice
  test: daml/splitwell-test/daml/Splice/Scripts/TestSplitwell.daml
  impl:
    - daml/splitwell/daml/Splice/Splitwell.daml
- repo: splice
  test: daml/splice-validator-lifecycle-test/daml/Splice/Scripts/TestValidatorOnboarding.daml
  impl:
    - daml/splice-validator-lifecycle/daml/Splice/ValidatorOnboarding.daml
- repo: splice
  test: daml/splice-amulet-name-service-test/daml/Splice/Scripts/TestAns.daml
  impl:
    - daml/splice-amulet-name-service/daml/Splice/Ans.daml
- repo: splice
